<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <h1>
        Student Registration Form
    </h1>
    <form>
        <label for="StudentName" id="StudentName" name="StudentName">
            <b>Student's Name:</b>
        </label>
        <input type="text"id=name name=Name placeholder="Enter your Name">
        <br><br>
        <label for="StudentID" id="StudentID" name="StudentID">
            <b>Student's ID:</b>
        </label>
        <input type="text"id=ID name=ID placeholder="Enter your ID">
        <br><br>
        <label for="StudentDOB" id="StudentDOB" name="StudentDOB">
            <b>Date of Birth:</b>
        </label>
        <input type="date"id=DOB name=DOB placeholder="Enter your date of birth">
        <br><br>
        <label for="StudentEmail" id="StudentEmail" name="StudentEmail">
            <b>Email:</b>
        </label>
        <input type="email"id=Email name=Email placeholder="Enter your Email">
        <br><br>
        <label for="StudentGender" id="StudentGender" name="StudentGender">
            <b>Gender:</b>
        </label>
        <input type="radio"id=Gender name=Gender placeholder="Enter your Gender" value="Male">Male
        <input type="radio"id=Gender name=Gender placeholder="Enter your Gender" value="Female">Female
        <input type="radio"id=Gender name=Gender placeholder="Enter your Gender" value="Others">Others
        <br><br>
        <label for="StuAddress" id="StuAddress" name="StuAddress">
            <b>Address:</b>
        </label>
        <textarea id="Address" name="Address" rows="2" cols="25"></textarea>
        <br><br>
        <input type="submit"id=Gender name=Gender value="Sign Up" >
        <input type="submit"id=Gender name=Gender value="Clear All" >
        

    </form>
</body>
</html>
