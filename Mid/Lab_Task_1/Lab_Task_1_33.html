<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carreer Development Office</title>
</head>
<body>
    <h1 align="left">Internship Form</h1>
    <form>
        <table>
            <tr>
                <td>Student Name: </td>
                <td><input type="text" name="sName" placeholder="Enter your name" ></td>
            </tr>
            <tr>
                <td>Email Address: </td>
                <td><input type="email" name="email" placeholder="Enter your email" ></td>
            </tr>
            <tr>
                <td>Prefered Internship:</td>
                <td>
                <input type="radio" name="pi" value="on_site">On-Site
                <input type="radio" name="pi" value="remote">Remote
                </td>
            </tr>
            <tr>
                <td>Internship Duration: </td>
                <td>
                <select name="Int_du:" >
                    <option value="6 Weeks">6 weeks</option>
                    <option value="3 Months">3 Months</option>
                </select>
            </td>
            </tr>
            <tr>
                <td>Skill of Interest: </td>
                <td>
                <input type="checkbox" name="soi" value="Wd">Web Development
                <input type="checkbox" name="soi" value="da">Data Analysis
                <input type="checkbox" name="soi" value="ma">Mobile Apps
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" name="submit" value="Submit">
                </td>
            </tr>   
        </table>
    </form>
    
</body>
</html>
